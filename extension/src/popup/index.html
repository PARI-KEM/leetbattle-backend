<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeetBattle</title>
    <style>
      body {
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0;
        padding: 14px;
        width: 280px;
        color: #1a1a1a;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .row { margin-bottom: 10px; }
      label { display: block; font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 0.04em; margin-bottom: 3px; }
      input { width: 100%; padding: 6px 8px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
      button { background: #ffa116; border: 0; color: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
      button.ghost { background: #f2f2f2; color: #333; }
      .hint { color: #777; font-size: 11px; margin-top: 6px; }
      .status { font-size: 12px; color: #2a7a2a; }
      .status.err { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>LeetBattle</h1>
    <div class="row">
      <label for="backend">Backend URL</label>
      <input id="backend" type="text" placeholder="https://leetbattle-backend.onrender.com" />
      <div class="hint">The Spring server hosting the battle rooms.</div>
    </div>
    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="ghost">Test connection</button>
      <button id="open" class="ghost">Open LeetCode</button>
    </div>
    <div id="status" class="status"></div>
    <div class="hint">The battle panel lives inside leetcode.com — click the orange <strong>Battle</strong> button on the page.</div>

    <script src="../../lib/api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
